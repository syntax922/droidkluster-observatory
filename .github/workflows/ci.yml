name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      # Mechanism-only: this public workflow greps source for the *shape* of
      # a gh.event.* subject (neutral tokens vs. any other literal), never
      # for private repo/org names — the real term list can only live in
      # the private GitOps repo's own scheduled check.
      - run: npm run check:redaction
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: VITE_DATA_BASE=http://127.0.0.1:4174 npm run test:e2e
